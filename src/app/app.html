<main class="flex flex-row h-full overflow-y-auto">
  <div class="sidebar flex flex-col h-full p-1">
    @for (menuItem of menuItemList; track $index) {
    <div class="menu-item flex flex-col items-center p-1" [routerLink]="menuItem.routerLink" routerLinkActive="menu-item-active">
      <img [src]="menuItem.icon">
      <span>
        {{ menuItem.label }}
      </span>
    </div>
    }
  </div>
  <router-outlet />
</main>
